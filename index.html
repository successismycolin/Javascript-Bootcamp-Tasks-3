<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
</head>
<body>
    <form id="signUpForm">
        <div id="usernameDiv" class="formGroup">
            <label for="username" id="usernameLabel">Username</label>
            <input type="text" id="usernameBox" required>
        </div>

        <div id="emailDiv" class="formGroup">
            <label for="email" id="emailLabel">Email</label>
            <input type="email" id="emailBox" required>
            <span class="errorMessage" id="emailError"></span>
        </div>

        <div id="passwordDiv" class="formGroup">
            <label for="password" id="passwordLabel">Password</label>
            <input type="password" id="passwordBox" required>
            <span class="errorMessage" id="passwordError"></span>
        </div>

        <div id="termsDiv" class="formGroup">
            <label for="terms" id="termsLabel">Terms</label>
            <input type="checkbox" id="termsBox" required>
            <span class="errorMessage" id="termsError"></span>
        </div>

        <div id="submitButtonDiv" class="formGroup">
            <input id="submitButton" type="button" value="Submit">
        </div>
    </form>

    <script src="async.js"></script>
    <script src="validation.js"></script>
</body>
</html>
